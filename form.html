<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <title>- Product Review Form -</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form_script.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>

<form method="get" action="review.html">

    <div class="form-group">
        <label for="productName">
            Product Name
        </label>

        <select id="productName" name="productName" required>
            <option value="" selected disabled>
                Select a Product:
            </option>
        </select>

    </div>

    <div class="form-group">

        <p>Overall Rating</p>

        <label>
            <input type="radio" id="rating1" name="rating" value="1" required>
            *
        </label>
        <label>
            <input type="radio" id="rating2" name="rating" value="2" required>
            **
        </label>

        <label>
            <input type="radio" id="rating3" name="rating" value="3" required>
            ***
        </label>
        <label>
            <input type="radio" id="rating4" name="rating" value="4" required>
            ****
        </label>

        <label>
            <input type="radio" id="rating5" name="rating" value="5" required>
            *****
        </label>
    </div>

    <div class="form-group">
        
        <label for="installDate">
            Date of Installation
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate">
    </div>

    <div class="form-group">

        <p>Helpful Features</p>

        <label>

            <input type="checkbox"
                id="durability"
                name="features"
                value="Durability">

            Durability
        </label>

        <label>
            <input type="checkbox"
                id="easeofuse"
                name="features"
                value="Ease of Use">

            Ease of Use
        </label>

        <label>

            <input type="checkbox"
                id="performance"
                name="features"
                value="Performance">

            Performance
        </label>


        <label>
            <input type="checkbox"
                id="design"
                name="features"
                value="Design">
            Design
        </label>
    </div>

    <div class="form-group">

        <label for="review">
            Written Review
        </label>

        <textarea
            id="review"
            name="review"
            rows="5"></textarea>

    </div>

    <div class="form-group">

        <label for="userName">
            Your Name
        </label>

        <input
            type="text"
            id="userName"
            name="userName">

    </div>

    <input
        type="submit"
        value="Post Review">
</form>

</main>

<footer>
    <p>&copy;2026 Ezequiel Piccardo</p>
    <p id="lastModified"></p>
</footer>

</body>
</html>
